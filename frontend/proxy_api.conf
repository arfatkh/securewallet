# Re-resolve the api container through Docker's DNS, so recreating it doesn't leave nginx with a stale IP.
# A project-specific alias, not "api": on Dokploy, web also joins the shared dokploy-network, where
# another stack's "api" service would answer instead.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://securewallet-api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
