# Runs as an unprivileged user (nginx-unprivileged image) on port 8080.
# Production adds the real client IP from the HTTPS proxy in front (deploy/real_ip.conf); empty locally.
include /etc/nginx/extra/*.conf;

limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;   # outer throttle in front of the API's own limits
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 32k;

    # Strict CSP: no inline scripts, no third-party origins (fonts are self-hosted).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_api.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_api.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
