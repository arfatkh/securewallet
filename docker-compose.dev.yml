# Development overlay: exposes the API on localhost:8000 for the test suite.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d db api
services:
  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EXPECTED_ORIGINS: http://localhost:8080,http://localhost:5173
