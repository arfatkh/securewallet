# Production only (mounted by docker-compose.prod.yml). nginx sits behind Caddy, so
# $remote_addr would be Caddy's container IP for every visitor. Take the real client
# IP from the X-Forwarded-For header Caddy sets. Trusted only from Docker's private
# ranges: in production nginx has no published port, so only Caddy can reach it.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
